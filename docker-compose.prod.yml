services:
  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadops
      POSTGRES_USER: leadops
      POSTGRES_PASSWORD: ${LEADOPS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadops -d leadops"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - leadops_prod_pgdata:/var/lib/postgresql/data

volumes:
  leadops_prod_pgdata:
